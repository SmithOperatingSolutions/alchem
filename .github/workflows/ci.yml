name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The race detector over every package runs nightly and on request; pull
  # requests run it on the packages with concurrent Go code.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs so a moved tag cannot change what
# runs here; the trailing comment records the release each SHA belongs to.
jobs:
  # A squash merge puts on main the same tree the pull request's checks ran
  # on. When that is so, and those checks passed, the jobs below are skipped
  # for the push to main: they could only repeat the result.
  verified:
    name: Already verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          skip=false
          if [[ "$EVENT" == push ]]; then
            skip=$(.github/scripts/already-verified.sh "$REPOSITORY" "$COMMIT")
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip the checks: $skip"

  native:
    name: Native (${{ matrix.os }}, Go ${{ matrix.go }})
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.27.x
            exe: ''
          - os: windows-latest
            go: 1.27.x
            exe: .exe
          - os: macos-latest
            go: 1.27.x
            exe: ''
          - os: ubuntu-latest
            go: stable
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.mod
      - name: Toolchain and runner architecture
        run: go version
      # The race detector instruments the Go code of the test binaries. The
      # packages with concurrent Go code get it on every pull request; the
      # rest, mostly the compiler and the test runner, which build and run
      # programs as separate processes, only in the nightly race job. The
      # Go stable job checks a newer toolchain and leaves races to the others.
      - name: Race checks on the concurrent packages
        if: matrix.go != 'stable'
        run: go test -race -timeout 15m ./compiler/actor/... ./lsp
      - name: Unit and integration tests
        run: go test -timeout 25m ./...
      - name: Vet
        run: go vet ./...
      - name: Native CLI smoke test
        run: |
          go build -o artifacts/alchem${{ matrix.exe }} ./cmd/alchem
          ./artifacts/alchem${{ matrix.exe }} build examples/map_traversal.alc
          actual_output=$(./map_traversal${{ matrix.exe }})
          if [[ "$actual_output" != "traversal ready" ]]; then
            printf 'unexpected output: %q\n' "$actual_output" >&2
            exit 1
          fi
          ./artifacts/alchem${{ matrix.exe }} check examples/system
          ./artifacts/alchem${{ matrix.exe }} fmt --check examples/system
          ./artifacts/alchem${{ matrix.exe }} build -o artifacts/system${{ matrix.exe }} examples/system
          actual_output=$(./artifacts/system${{ matrix.exe }})
          test "$actual_output" = "system ready"
      - name: Key-value server example
        run: |
          ./artifacts/alchem${{ matrix.exe }} fmt --check examples
          ./artifacts/alchem${{ matrix.exe }} check examples/kv/main.alc
          ./artifacts/alchem${{ matrix.exe }} check examples/kv/client.alc
          ./artifacts/alchem${{ matrix.exe }} test examples/kv/test

  cross:
    name: Cross-compile six targets
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: 100,000-process memory budget
        run: go test -run TestHundredThousandProcessesWithinMemoryBudget -count=1 -v ./compiler/actor
      - name: Build CLI and Alchem program for every target
        shell: bash
        run: |
          go build -o artifacts/alchem-host ./cmd/alchem
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            target_os=${target%/*}
            target_arch=${target#*/}
            target_exe=''
            if [[ "$target_os" == windows ]]; then target_exe='.exe'; fi
            target_dir="artifacts/targets/$target_os-$target_arch"
            mkdir -p "$target_dir"
            GOOS="$target_os" GOARCH="$target_arch" CGO_ENABLED=0 go build -o "$target_dir/alchem$target_exe" ./cmd/alchem
            (
              cd "$target_dir"
              GOOS="$target_os" GOARCH="$target_arch" CGO_ENABLED=0 "$GITHUB_WORKSPACE/artifacts/alchem-host" build "$GITHUB_WORKSPACE/examples/system"
              test -s "system$target_exe"
            )
          done
      - name: Benchmark programs check
        shell: bash
        run: |
          # The Benchmarks workflow is run by hand, so a benchmark program the
          # language has outgrown would otherwise go unnoticed until then.
          # bench.alc is the suite's shared module, not a program.
          for program in benchmarks/alchem/*.alc benchmarks/alchem/suite/*.alc; do
            if [[ "$program" == */bench.alc ]]; then continue; fi
            artifacts/alchem-host check "$program"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-compiled-binaries
          path: artifacts/targets/
          if-no-files-found: error
          retention-days: 7

  # Native execution on the three OS/architecture pairs the required matrix
  # does not cover. It is deliberately outside the required "test" gate: these
  # runner labels are not offered on every plan, and an unavailable runner
  # would otherwise leave the gate waiting.
  native-extended:
    name: Native extended (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            exe: ''
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            exe: .exe
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Confirm runner platform
        env:
          WANT: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          actual="$(go env GOOS)/$(go env GOARCH)"
          go version
          if [[ "$actual" != "$WANT" ]]; then
            printf 'runner is %s, expected %s\n' "$actual" "$WANT" >&2
            exit 1
          fi
      - name: Unit and integration tests
        # The Intel macOS runner takes about ten minutes for the compiler
        # package alone, so the per-package limit matches the Native jobs.
        run: go test -timeout 25m ./...
      - name: Native CLI smoke test
        run: |
          go build -o artifacts/alchem${{ matrix.exe }} ./cmd/alchem
          ./artifacts/alchem${{ matrix.exe }} test tests/fixtures
          ./artifacts/alchem${{ matrix.exe }} build -o artifacts/system${{ matrix.exe }} examples/system
          actual_output=$(./artifacts/system${{ matrix.exe }})
          test "$actual_output" = "system ready"

  race:
    name: Race detector, every package
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.mod
      - name: Unit, integration and race checks
        run: go test -race -timeout 25m ./...

  coverage:
    name: Coverage
    needs: verified
    if: needs.verified.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: go.mod
      # The compiler, the tools and the runtime that compiled programs
      # carry, measured together; the minimum only ever rises.
      - name: Measure coverage
        shell: bash
        run: go run ./tools/coverage -min 94 -o coverage.out | tee coverage.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt

  test:
    name: test
    if: always()
    needs: [verified, native, cross, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check to pass
        env:
          VERIFIED_RESULT: ${{ needs.verified.result }}
          ALREADY_VERIFIED: ${{ needs.verified.outputs.skip }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$VERIFIED_RESULT" == success && "$ALREADY_VERIFIED" == true ]]; then
            echo "the pull request's checks passed on this exact tree"
            exit 0
          fi
          test "$NATIVE_RESULT" = success && test "$CROSS_RESULT" = success && test "$COVERAGE_RESULT" = success
