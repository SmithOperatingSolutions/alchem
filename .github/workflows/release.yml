name: Release
on:
  push:
    tags: ['v*']
  # A manual run builds and checks the archives without publishing them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Whether the signing secrets are set; a step's condition cannot read
      # secrets itself.
      APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            target_os=${target%/*}
            target_arch=${target#*/}
            exe=''
            if [[ "$target_os" == windows ]]; then exe='.exe'; fi
            name="alchem_${VERSION}_${target_os}_${target_arch}"
            mkdir -p "build/$name"
            GOOS="$target_os" GOARCH="$target_arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/alchem$exe" ./cmd/alchem
            cp README.md LICENSE "build/$name/"
          done
      # Signing runs only when its secrets are set; see docs/releasing.md.
      # macOS binaries are signed and notarized with rcodesign, which runs on
      # Linux; Windows binaries are signed with osslsigncode.
      - name: Sign and notarize the macOS binaries
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_JSON }}
        if: env.APPLE_SIGNING == 'true'
        run: |
          archive=apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/$archive"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $archive" | sha256sum -c -
          tar -xzf "$archive"
          rcodesign="$PWD/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign"
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/developer-id.password"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.json"
          for binary in build/*_darwin_*/alchem; do
            "$rcodesign" sign --p12-file "$RUNNER_TEMP/developer-id.p12" --p12-password-file "$RUNNER_TEMP/developer-id.password" \
              --code-signature-flags runtime "$binary"
            (cd "$(dirname "$binary")" && zip -q "$RUNNER_TEMP/notarize.zip" alchem)
            "$rcodesign" notary-submit --api-key-file "$RUNNER_TEMP/notary-key.json" --wait "$RUNNER_TEMP/notarize.zip"
            rm "$RUNNER_TEMP/notarize.zip"
          done
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.password" "$RUNNER_TEMP/notary-key.json"
      - name: Sign the Windows binaries
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        if: env.WINDOWS_SIGNING == 'true'
        run: |
          sudo apt-get install -y -qq osslsigncode
          printf '%s' "$PFX" | base64 -d > "$RUNNER_TEMP/signing.pfx"
          for binary in build/*_windows_*/alchem.exe; do
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/signing.pfx" -pass "$PFX_PASSWORD" \
              -n "Alchem" -i "https://github.com/SmithOperatingSolutions/alchem" -t http://timestamp.digicert.com \
              -in "$binary" -out "$binary.signed"
            mv "$binary.signed" "$binary"
            osslsigncode verify -in "$binary" | grep -q "Signature verification: ok"
          done
          rm -f "$RUNNER_TEMP/signing.pfx"
      - name: Archive every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for dir in build/alchem_*; do
            name=$(basename "$dir")
            if [[ "$name" == *_windows_* ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt
      # The released binary, on a machine without Go on PATH, downloads the
      # pinned release and builds a program with it.
      - name: Released binary builds without an installed Go
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin="build/alchem_${VERSION}_linux_amd64/alchem"
          "$bin" version | grep -q "alchem $VERSION linux/amd64"
          env -u GOROOT PATH=/usr/bin:/bin ALCHEM_CACHE="$RUNNER_TEMP/alchem" "$bin" build -o "$RUNNER_TEMP/hello" examples/hello.alc
          test "$("$RUNNER_TEMP/hello")" = "Hello from Alchem!"
          env PATH=/usr/bin:/bin ALCHEM_CACHE="$RUNNER_TEMP/alchem" "$bin" version | grep -q "(downloaded)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" --verify-tag --generate-notes --title "Alchem $VERSION" "${prerelease[@]}" dist/*
      # The Homebrew formula and Scoop manifest for this release, attached so
      # that the pull request updating Formula/ and bucket/ can take them.
      - name: Package-manager manifests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/packaging -version "$VERSION" -checksums dist/checksums.txt -dir "$RUNNER_TEMP/packaging"
          cp "$RUNNER_TEMP/packaging/Formula/alchem.rb" "$RUNNER_TEMP/packaging/bucket/alchem.json" .
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release upload "$VERSION" alchem.rb alchem.json
          fi
