name: Release
on:
  push:
    tags: ['v*']
  # A manual run builds, signs with certificates made for the run, checks
  # and packs the archives without publishing them. Asked to leave them
  # unsigned, it signs nothing, as a tag does while no signing secret is set.
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Leave the binaries unsigned, as a tag does with no signing secrets'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# What is released is the alchem written in Alchem (native/), for each
# target its compiler builds itself on: Linux on x64 and ARM64, macOS on
# Apple silicon and Windows on x64. It is built from the released compiler
# native/ pins, with neither Go nor Rust, and it compiles programs itself:
# an installed alchem needs no Go and downloads nothing. The Go alchem
# (cmd/alchem) stays in the repository as the reference the checks compare
# against and is not released.
jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Whether the signing secrets are set; a step's condition cannot read
      # secrets itself.
      APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
    defaults:
      run:
        shell: bash
        working-directory: native
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: native
          cache: false
          install_args: python
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # One build at a time: no memory ceiling.
          ALCHEM_VERIFY_LIMITED: '1'
        run: |
          python3 scripts/verify-quick.py --build-only
          python3 scripts/build-arm64.py --compiler build/dev/A2 --output build/dev/alchem-compiler-arm64
          python3 scripts/build-arm64.py --darwin --compiler build/dev/A2 --output build/dev/alchem-compiler-darwin
          python3 scripts/build-windows.py --compiler build/dev/A2 --cross build/dev/alchem-compiler-windows-cross --output build/dev/alchem-compiler-windows.exe
          made() {  # OS ARCH FILE COMPILER [FLAG]
            local name="alchem_${VERSION}_$1_$2"
            mkdir -p "build/release/$name"
            python3 scripts/build-alchem.py --version "$VERSION" --compiler "$4" --output "build/release/$name/$3" ${5:-}
            cp ../README.md ../LICENSE "build/release/$name/"
          }
          made linux amd64 alchem build/dev/A2
          made linux arm64 alchem build/dev/alchem-compiler-arm64 --arm64
          made darwin arm64 alchem build/dev/alchem-compiler-darwin --darwin
          made windows amd64 alchem.exe build/dev/alchem-compiler-windows-cross --windows
      # Signing with the release's certificates runs only when its secrets
      # are set; see docs/releasing.md. The macOS binary is signed and
      # notarized with rcodesign, which runs on Linux; the Windows binary is
      # signed with osslsigncode. A manual run signs with certificates it
      # makes for itself, so that the jobs after it run the binaries as a
      # release signs them; nothing of such a run is published. Asked to
      # leave them unsigned, it runs none of these steps.
      - name: rcodesign
        if: (env.APPLE_SIGNING == 'true' || github.ref_type != 'tag') && !inputs.unsigned
        run: |
          archive=apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/$archive"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" >> "$GITHUB_ENV"
      - name: Sign and notarize the macOS binary
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_JSON }}
        if: env.APPLE_SIGNING == 'true' && !inputs.unsigned
        run: |
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/developer-id.password"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.json"
          for binary in build/release/*_darwin_*/alchem; do
            "$RCODESIGN" sign --p12-file "$RUNNER_TEMP/developer-id.p12" --p12-password-file "$RUNNER_TEMP/developer-id.password" \
              --code-signature-flags runtime "$binary"
            (cd "$(dirname "$binary")" && zip -q "$RUNNER_TEMP/notarize.zip" alchem)
            "$RCODESIGN" notary-submit --api-key-file "$RUNNER_TEMP/notary-key.json" --wait "$RUNNER_TEMP/notarize.zip"
            rm "$RUNNER_TEMP/notarize.zip"
          done
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.password" "$RUNNER_TEMP/notary-key.json"
      - name: Sign the macOS binary with a certificate of this run
        if: env.APPLE_SIGNING != 'true' && github.ref_type != 'tag' && !inputs.unsigned
        run: |
          "$RCODESIGN" generate-self-signed-certificate --person-name 'Alchem release rehearsal' \
            --p12-file "$RUNNER_TEMP/rehearsal.p12" --p12-password rehearsal
          printf rehearsal > "$RUNNER_TEMP/rehearsal.password"
          for binary in build/release/*_darwin_*/alchem; do
            "$RCODESIGN" sign --p12-file "$RUNNER_TEMP/rehearsal.p12" --p12-password-file "$RUNNER_TEMP/rehearsal.password" \
              --code-signature-flags runtime "$binary"
          done
      - name: Sign the Windows binary
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        if: env.WINDOWS_SIGNING == 'true' && !inputs.unsigned
        run: |
          sudo apt-get install -y -qq osslsigncode
          printf '%s' "$PFX" | base64 -d > "$RUNNER_TEMP/signing.pfx"
          for binary in build/release/*_windows_*/alchem.exe; do
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/signing.pfx" -pass "$PFX_PASSWORD" \
              -n "Alchem" -i "https://github.com/SmithOperatingSolutions/alchem" -t http://timestamp.digicert.com \
              -in "$binary" -out "$binary.signed"
            mv "$binary.signed" "$binary"
            osslsigncode verify -in "$binary" | grep -q "Signature verification: ok"
          done
          rm -f "$RUNNER_TEMP/signing.pfx"
      - name: Sign the Windows binary with a certificate of this run
        if: env.WINDOWS_SIGNING != 'true' && github.ref_type != 'tag' && !inputs.unsigned
        run: |
          sudo apt-get install -y -qq osslsigncode
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/rehearsal.key" -out "$RUNNER_TEMP/rehearsal.crt" \
            -days 2 -subj '/CN=Alchem release rehearsal' -addext 'extendedKeyUsage=codeSigning' 2> /dev/null
          openssl pkcs12 -export -out "$RUNNER_TEMP/rehearsal.pfx" -inkey "$RUNNER_TEMP/rehearsal.key" -in "$RUNNER_TEMP/rehearsal.crt" -passout pass:rehearsal
          for binary in build/release/*_windows_*/alchem.exe; do
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/rehearsal.pfx" -pass rehearsal \
              -n "Alchem" -i "https://github.com/SmithOperatingSolutions/alchem" -in "$binary" -out "$binary.signed"
            mv "$binary.signed" "$binary"
            osslsigncode verify -CAfile "$RUNNER_TEMP/rehearsal.crt" -in "$binary" | grep -q "Signature verification: ok"
          done
      - name: Pack for the jobs after this one
        # One file: an artifact does not keep which files are programs.
        run: |
          chmod 755 build/release/*/alchem build/release/*/alchem.exe
          tar -C build/release -cf build/alchem.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alchem
          path: native/build/alchem.tar
          if-no-files-found: error
          retention-days: 7

  # Each alchem as it is released, signed, on its own target, on a machine
  # with no Go: it says its version and target, builds and runs a program,
  # says where and why it refuses another, and serves an editor.
  check:
    name: alchem on ${{ matrix.system }}/${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            arch: amd64
            runner: ubuntu-24.04
            python: python3
          - system: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            python: python3
          - system: darwin
            arch: arm64
            runner: macos-15
            python: python3
          - system: windows
            arch: amd64
            runner: windows-2025
            python: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alchem
      - name: Version, a program, a refusal
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tar -xf alchem.tar
          alchem="$(echo "$PWD"/alchem_*_${{ matrix.system }}_${{ matrix.arch }}/alchem*)"
          "$alchem" version | tee version.txt
          grep -q "^alchem $VERSION ${{ matrix.system }}/${{ matrix.arch }}" version.txt
          mkdir work && cd work
          printf 'defmodule Hello do\n  def main() do\n    IO.puts("Hello from alchem!")\n  end\nend\n' > hello.alc
          printf 'defmodule Wrong do\n  def main() do\n    IO.puts(1 <> 2)\n  end\nend\n' > wrong.alc
          # No Go on PATH, and nothing of it is downloaded.
          clean() { env -u GOROOT -u GOPATH PATH=/usr/bin:/bin "$@"; }
          test "$(clean "$alchem" run hello.alc)" = 'Hello from alchem!'
          built=hello; if [[ "${{ matrix.system }}" == windows ]]; then built=hello.exe; fi
          clean "$alchem" build -o "$built" hello.alc
          test "$(./"$built")" = 'Hello from alchem!'
          if clean "$alchem" check wrong.alc 2> said.txt; then echo 'a wrong program was accepted' >&2; exit 1; fi
          cat said.txt
          grep -q 'wrong.alc:3:15: <> requires strings' said.txt
          echo "ALCHEM=$alchem" >> "$GITHUB_ENV"
      - name: An editor's session
        run: ${{ matrix.python }} .github/scripts/lsp-session.py "$ALCHEM"

  pack:
    name: Archives
    needs: [build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alchem
          path: ${{ runner.temp }}/alchem
      - name: Archive every target
        run: |
          mkdir -p build dist
          tar -C build -xf "$RUNNER_TEMP/alchem/alchem.tar"
          for dir in build/alchem_*; do
            name=$(basename "$dir")
            if [[ "$name" == *_windows_* ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          test "$(ls dist | wc -l)" = 4
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The install scripts against these archives, served from the machine
  # itself, on each system they install on and with no Go there: what is
  # installed says the release's version and builds and runs a program.
  install:
    name: Install script on ${{ matrix.runner }}
    needs: [build, pack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: site/download/${{ needs.build.outputs.version }}
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &
          server=$!
          for _ in $(seq 20); do curl -fsS -o /dev/null "http://127.0.0.1:8765/download/$VERSION/checksums.txt" && break; sleep 0.5; done
          ALCHEM_VERSION="$VERSION" ALCHEM_RELEASES_URL=http://127.0.0.1:8765 ALCHEM_INSTALL_DIR="$RUNNER_TEMP/installed" sh install.sh
          kill "$server"
          "$RUNNER_TEMP/installed/alchem" version | grep -q "^alchem $VERSION "
          test "$(env -u GOROOT PATH=/usr/bin:/bin "$RUNNER_TEMP/installed/alchem" run examples/hello.alc)" = "Hello from Alchem!"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'site' -PassThru -WindowStyle Hidden
          try {
            foreach ($i in 1..40) {
              try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/download/$env:VERSION/checksums.txt" | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            $env:ALCHEM_RELEASES_URL = 'http://127.0.0.1:8765'
            $env:ALCHEM_VERSION = $env:VERSION
            $env:ALCHEM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'installed'
            ./install.ps1
          } finally { Stop-Process -Id $server.Id -Force }
          $alchem = Join-Path $env:ALCHEM_INSTALL_DIR 'alchem.exe'
          $said = & $alchem version | Select-Object -First 1
          if ($said -ne "alchem $env:VERSION windows/amd64") { throw "installed: $said" }
          $out = & $alchem run examples/hello.alc
          if ($out -ne 'Hello from Alchem!') { throw "the installed alchem ran: $out" }

  publish:
    name: Publish
    needs: [build, pack, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" --verify-tag --generate-notes --title "Alchem $VERSION" "${prerelease[@]}" dist/*
      # The Homebrew formula and Scoop manifest for this release, attached so
      # that the pull request updating Formula/ and bucket/ can take them.
      - name: Package-manager manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./tools/packaging -version "$VERSION" -checksums dist/checksums.txt -dir "$RUNNER_TEMP/packaging"
          cp "$RUNNER_TEMP/packaging/Formula/alchem.rb" "$RUNNER_TEMP/packaging/bucket/alchem.json" .
          ruby -c alchem.rb
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release upload "$VERSION" alchem.rb alchem.json
          fi
