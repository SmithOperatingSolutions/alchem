name: Packaging
on:
  pull_request:
    paths:
      - 'Formula/**'
      - 'bucket/**'
      - 'install.sh'
      - 'install.ps1'
      - 'tools/packaging/**'
      - '.github/workflows/packaging.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job installs a published release the way a user would. They depend on
# GitHub and on the package managers, so they are not part of the required
# gate.
jobs:
  homebrew:
    name: Homebrew tap
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from this repository as a tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # A tap is cloned from its branch, so the checkout needs one.
          git checkout -B packaging-check
          brew tap smithoperatingsolutions/alchem "$GITHUB_WORKSPACE"
          brew install smithoperatingsolutions/alchem/alchem
          brew test smithoperatingsolutions/alchem/alchem
          alchem version

  scoop:
    name: Scoop manifest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from the manifest
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          scoop install .\bucket\alchem.json
          alchem version

  install-scripts:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          ALCHEM_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/alchem" version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ALCHEM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1
          & (Join-Path $env:ALCHEM_INSTALL_DIR 'alchem.exe') version
