name: Native compiler
# The compiler written in Alchem (native/): the released compiler
# native/pinned-compiler.json names builds it, it builds itself to a fixpoint
# (A1 = A2), and every gate compares its programs with those of the Go
# compiler this native/ is pinned to. A build needs neither Go nor Rust; Go
# is installed as that reference. The x86-64 job also makes the first stage
# from the source with the Go frontend and the Rust backend (the seed) and
# requires the compiler made from it to be the one made from the pinned
# release, byte for byte, on pull requests too: the seed's frontend takes
# less than the native compiler does, and the compiler's source must stay
# within it. The nightly and requested runs also run the gates that take
# those two. On x86-64 the ARM64 programs run under QEMU; the ARM64 job runs
# them on an ARM64 machine, and the x86-64 compiler stages under QEMU
# instead. A job of its own builds the compiler
# for macOS as a macOS program, which four macOS jobs check side by side
# (scripts/verify-darwin.py --shard). The complete suite
# (scripts/verify-local.sh --with-source) runs nightly and on request. The
# Windows compiler (native/spec/windows.md) is built in a job of its own
# too, and the Windows job runs it: it must make itself again byte for byte.
# A pull request whose inputs to these jobs (.github/scripts/native-verified.sh)
# have passed them already, in a run of this repository, is not checked
# again; the nightly and requested runs always check.
on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A download of the toolchain that fails is tried again, over minutes.
  MISE_HTTP_RETRIES: '10'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified:
    name: Already verified
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.look.outputs.key }}
      run: ${{ steps.look.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          key=$(bash .github/scripts/native-verified.sh key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          run=''
          if [[ "$EVENT" == pull_request ]]; then
            run=$(bash .github/scripts/native-verified.sh run "$REPO" "$key")
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ -n "$run" ]]; then
            echo "The native jobs' inputs ($key) passed in $run: they are not checked again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The native jobs' inputs ($key) have not passed before: they are checked." >> "$GITHUB_STEP_SUMMARY"
          fi

  native:
    name: ${{ matrix.name }}
    needs: verified
    if: needs.verified.outputs.run == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            gates: ''
          - name: ARM64
            runner: ubuntu-24.04-arm
            # Matches arm64, x86_to_arm64 and arm64_floats.
            gates: arm64
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: native
          cache: false
          # Rust only where the seed is made: the x86-64 job, and every job
          # of the nightly and requested runs.
          install_args: ${{ github.event_name == 'pull_request' && matrix.gates != '' && 'go python' || '' }}
      - name: Tools
        # strace for the fault-injection gates; QEMU and an ARM64 assembler
        # unpacked into build/arm64-tools for the ARM64 gates. On ARM64,
        # qemu-user-static also registers x86-64 with binfmt_misc, so the
        # x86-64 compiler stages run as they are.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q strace
          if [[ "$(uname -m)" == aarch64 ]]; then
            sudo apt-get install -y -q qemu-user-static binfmt-support binutils-x86-64-linux-gnu
            test -e /proc/sys/fs/binfmt_misc/qemu-x86_64
          fi
          bash scripts/fetch-arm64-tools.sh
      - name: Memory limits
        # scripts/limited caps memory with a systemd user scope. Without a
        # user manager it falls back to capping address space, which the
        # programs of the processes, network and speed gates exceed (each
        # reserves a 16 GiB arena and a stack per process), so start one.
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do
            systemd-run --user --scope --quiet -p MemoryMax=1G true && exit 0
            sleep 1
          done
          echo 'no systemd user manager' >&2
          exit 1
      - name: Dependencies
        env:
          GATES: ${{ matrix.gates }}
        run: |
          mise run fetch
          if [[ "$GITHUB_EVENT_NAME" != pull_request || -z "$GATES" ]]; then mise run fetch:seed; fi
      - name: Go compiler reference
        # build/dev/alchem-upstream, the Go compiler native/ is pinned to:
        # the tls gate also compares with the programs it builds.
        if: matrix.gates == ''
        run: |
          python3 -c "import importlib.util as u; s = u.spec_from_file_location('upstream', 'scripts/upstream-examples.py'); m = u.module_from_spec(s); s.loader.exec_module(m); m.build_upstream()"
          test -x build/dev/alchem-upstream.bin
      - name: Fixpoint and gates
        if: github.event_name == 'pull_request' || matrix.gates != ''
        env:
          ALCHEM_VERIFY_MEMORY: 14G
          GATES: ${{ matrix.gates }}
        run: python3 scripts/verify-quick.py --jobs 4 $GATES
      - name: Complete suite
        if: github.event_name != 'pull_request' && matrix.gates == ''
        env:
          ALCHEM_VERIFY_MEMORY: 14G
        run: bash scripts/verify-local.sh --with-source
      - name: The seed gives the compiler the pinned release gives
        # The first stage can still be made from the source, without a
        # released compiler, and it comes to the same compiler.
        if: matrix.gates == ''
        env:
          ALCHEM_VERIFY_LIMITED: '1'
        run: |
          python3 scripts/verify-quick.py --build-only
          cp build/dev/A2 build/dev/A2-pinned
          python3 scripts/verify-quick.py --seed --build-only
          cmp build/dev/A2 build/dev/A2-pinned

  derived:
    # Every file made from other files is what its generator makes of them
    # (native/scripts/verify-derived.py), with the assemblers and the C
    # compiler of the development container, the same wherever it runs.
    name: Derived files
    needs: verified
    if: needs.verified.outputs.run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate and compare
        run: |
          bash scripts/linux-container.sh bash -c '
            (cd adapters/alchem && GOMODCACHE=/work/.cache/gomod go mod download) &&
            python3 scripts/verify-derived.py'

  windows-compiler:
    # spec/windows.md: the Windows compiler, the programs it is checked with
    # and the pinned compiler as a Windows program, built on Linux beside the
    # gates.
    name: Compiler for Windows
    needs: verified
    if: needs.verified.outputs.run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: native
          cache: false
          install_args: go python
      - name: Dependencies
        run: mise run fetch
      - name: Build
        # One build at a time: no memory ceiling (scripts/limited would cap
        # address space here, with no systemd user manager).
        env:
          ALCHEM_VERIFY_LIMITED: '1'
        run: |
          python3 scripts/verify-quick.py --build-only
          mkdir -p build/windows
          python3 scripts/build-windows.py --source build/windows/compiler-source.alc --output build/windows/alchem-compiler-windows.exe
          cp examples/hello-native.alc build/windows/hello.alc
          cp scripts/windows-examples.py scripts/windows-commit-map.py build/windows/
          cp harness/commands.py harness/commands-cases.json.xz build/windows/
          python3 scripts/windows-examples.py prepare build/windows/examples
          # One file of them: the Windows runner does not unpack an artifact
          # of 14,000 files.
          tar -czf build/windows/examples.tar.gz -C build/windows examples
          rm -r build/windows/examples
          python3 scripts/windows-examples.py pinned build/windows/alchem-upstream.exe
          python3 scripts/build-alchem.py --windows --compiler build/dev/alchem-compiler-windows-cross --output build/windows/alchem.exe
          cp -r ../examples/testing build/windows/testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-compiler
          path: native/build/windows
          retention-days: 3

  macos-compiler:
    # spec/darwin-arm64.md: the compiler that makes macOS programs, which
    # compiles its own source into the compiler as a macOS program. Its stages
    # are Linux x86-64 programs, so it is built here, beside the gates.
    name: Compiler for macOS
    needs: verified
    if: needs.verified.outputs.run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: native
          cache: false
          install_args: go python
      - name: Dependencies
        run: mise run fetch
      - name: Build
        # One build at a time: no memory ceiling (scripts/limited would cap
        # address space here, with no systemd user manager).
        env:
          ALCHEM_VERIFY_LIMITED: '1'
        run: |
          python3 scripts/verify-quick.py --build-only
          python3 scripts/build-arm64.py --darwin --compiler build/dev/A2 \
            --output build/dev/alchem-compiler-darwin --macos build/dev/alchem-compiler-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alchem-compiler-macos
          path: native/build/dev/alchem-compiler-macos
          retention-days: 7

  macos:
    name: macOS ARM64 (${{ matrix.shard }}/4)
    needs: macos-compiler
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: native
          cache: false
          install_args: go python
      - name: Dependencies
        run: mise run fetch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alchem-compiler-macos
          path: native/build/dev
      - name: Gates on macOS, part ${{ matrix.shard }} of 4
        run: |
          chmod 700 build/dev/alchem-compiler-macos
          python3 scripts/verify-darwin.py build/dev/alchem-compiler-macos --shard ${{ matrix.shard }}/4

  windows:
    name: Windows x64
    needs: windows-compiler
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-compiler
          path: windows
      - name: The compiler makes itself
        run: |
          tar -xzf examples.tar.gz
          ./alchem-compiler-windows.exe < compiler-source.alc > again.exe
          cmp again.exe alchem-compiler-windows.exe
      - name: A program
        run: |
          ./alchem-compiler-windows.exe < hello.alc > hello.exe
          out="$(./hello.exe)"
          test "$out" = 'Hello from native Alchem!'
      - name: What a program and the compiler commit
        # A process commits about what it uses: reserved memory it has not
        # touched (the arena, the collector's tables) is not committed
        # (spec/windows.md, Memory; #104, where each committed 2.3 GiB).
        run: |
          printf 'defmodule T do\n  def main() do\n    Process.sleep(5000)\n    IO.puts("done")\n  end\nend\n' > sleeper.alc
          ./alchem-compiler-windows.exe < sleeper.alc > sleeper.exe
          python windows-commit-map.py --most 256 2 ./sleeper.exe < /dev/null
          python windows-commit-map.py --most 256 2 ./alchem-compiler-windows.exe < /dev/null
      - name: The upstream examples and the gates' programs
        # Each prints on Windows what it prints on Linux (spec/windows.md).
        run: python windows-examples.py check examples ./alchem-compiler-windows.exe --jobs 4
      - name: The programs with processes, twenty times each
        # A result that depends on how processes fall in time shows as one
        # run in a few: none may.
        if: ${{ !cancelled() }}
        run: python windows-examples.py check examples ./alchem-compiler-windows.exe --jobs 4 --only gate/processes/ --repeat 20
      - name: The supervised server that fails, a thousand times
        # The program sleeps 50 ms while its supervisor starts the server
        # again: the trace of the failure may not take the 50 ms from it
        # (spec/windows.md, Processes). Eight at once, so that a trace
        # takes longer than it does alone.
        if: ${{ !cancelled() }}
        run: python windows-examples.py check examples ./alchem-compiler-windows.exe --jobs 8 --only gate/processes/66 --repeat 1000
      - name: How long a failing call takes on the program's clock
        if: ${{ !cancelled() }}
        run: |
          cat > trace.alc <<'ALC'
          defmodule T do
            def main() do
              tree = Supervisor.start("one_for_one", 3, 1000, [Supervisor.server(:t, "permanent", 0, fn(total: integer, n: integer): tuple[integer, integer] do {total + n, div(10, n)} end)], 1)
              found: option[server[integer, integer]] = Server.whereis(:t)
              case found do
                some(total) ->
                  t0 = System.monotonic_time(:millisecond)
                  Server.call(total, 0, 1000)
                  t1 = System.monotonic_time(:millisecond)
                  IO.puts(Integer.to_string(t1 - t0))
                none -> IO.puts("none")
              end
              Supervisor.stop(tree, 1000)
            end
          end
          ALC
          ./alchem-compiler-windows.exe < trace.alc > trace.exe
          seq 200 | xargs -P 4 -I{} ./trace.exe | sort -n | uniq -c | tr '\n' ' '
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version: 1.27.4
          cache: false
      - name: What Windows prints otherwise, against the pinned compiler's Windows programs
        if: ${{ !cancelled() }}
        run: python windows-examples.py reference examples ./alchem-upstream.exe ./alchem-compiler-windows.exe
      - name: alchem.exe's help, syntax, doc, docs, agent-guide and agent-install
        if: ${{ !cancelled() }}
        # What the pinned command line prints and writes on Windows.
        run: python commands.py --against ./alchem-upstream.exe ./alchem.exe
      - name: alchem.exe
        if: ${{ !cancelled() }}
        # The test, run and build commands on Windows (build-alchem.py --windows).
        run: |
          ./alchem.exe test -seed 7 testing/test/cart_test.alc | tee test.txt
          grep -q '^8 tests, 0 failures$' test.txt
          ./alchem.exe build -o built.exe hello.alc
          test "$(./built.exe)" = 'Hello from native Alchem!'
          set +e
          printf 'defmodule T do\n  def main() do\n    IO.puts(inspect(System.argv()))\n    System.halt(3)\n  end\nend\n' > argv.alc
          out="$(./alchem.exe run argv.alc a 'b c')"
          status=$?
          set -e
          test "$out" = '["a", "b c"]'
          test "$status" = 3

  record:
    # Every job passed: the inputs are recorded as verified, by an artifact
    # named for their key, which native-verified.sh looks for.
    name: Record as verified
    needs: [verified, native, derived, windows-compiler, macos-compiler, macos, windows]
    if: needs.verified.outputs.run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          KEY: ${{ needs.verified.outputs.key }}
          SHA: ${{ github.sha }}
        run: echo "$KEY $SHA" > verified.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-verified-${{ needs.verified.outputs.key }}
          path: verified.txt
          retention-days: 30
