name: Benchmarks
# Manual run that measures Alchem against its Go and Elixir baselines on a
# hosted runner and stores the Markdown report as an artifact.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per program (1-100)
        required: true
        default: '7'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure Alchem, Go and Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - name: Run harness
        shell: bash
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          if [[ ! "$RUNS" =~ ^[0-9]{1,3}$ ]]; then
            echo 'runs must be a number' >&2
            exit 2
          fi
          go run ./benchmarks/harness -runs "$RUNS" | tee benchmark-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: benchmark-report.md
          if-no-files-found: error
          retention-days: 30
