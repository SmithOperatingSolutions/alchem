name: Go native backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build backend
        working-directory: implementations/go
        run: go build -o /tmp/alchem-native-go .
      - name: Shared acceptance suite
        run: python3 harness/run.py --compiler /tmp/alchem-native-go
