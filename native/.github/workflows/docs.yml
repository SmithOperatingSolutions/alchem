name: Documentation checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check research files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md docs/architecture.md docs/progress.md docs/experiment-matrix.md spec/ir.md spec/abi.md spec/executable-format.md; do
            test -s "$file"
          done
