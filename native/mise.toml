# Pinned development toolchain. The compiler builds from the released compiler
# pinned-compiler.json names and needs none of these but Python. Go is the
# reference the gates compare against (and, with Rust, makes the seed of
# verify-quick.py --seed and the complete suite). One Go serves both the
# reference backend and the pinned Alchem frontend (which needs Go 1.27 for
# its Unicode 17 tables).
min_version = "2026.7.0"

[tools]
go = "1.27.4"
rust = "1.100.0"
python = "3.15.2"

[env]
GOTOOLCHAIN = "local"
# Project-local module cache: shared between the host and the Linux container.
GOMODCACHE = "{{config_root}}/.cache/gomod"
GOFLAGS = "-modcacherw"

# --- Native tasks: require a Linux x86-64 host -------------------------------

[tasks.fetch]
description = "Download the locked Go dependencies of the reference"
run = "cd adapters/alchem && go mod download"

[tasks."fetch:seed"]
description = "Download the locked Rust dependencies of the seed (verify-quick.py --seed, the complete suite)"
run = "cargo fetch --locked --manifest-path implementations/rust/Cargo.toml"

[tasks.verify]
description = "Full local verification, including self-hosted stages"
run = "bash scripts/verify-local.sh --with-source"

[tasks."verify:quick"]
description = "Fast iteration from the pinned release: A1==A2 fixpoint, stage gates once in parallel (pass gate filters as args)"
run = "python3 scripts/verify-quick.py"

[tasks."verify:go"]
description = "Go reference backend baseline only"
run = "bash scripts/verify-local.sh"

[tasks."verify:rust"]
description = "Go and Rust backends without source checks"
run = "bash scripts/verify-local.sh --with-rust"

[tasks.build]
description = "Build the compiler, core tools and alchem from the pinned release into build/native"
run = "bash scripts/build-native.sh"

# --- Container tasks: run the above in linux/amd64 from any host -------------

[tasks."linux:image"]
description = "Build the linux/amd64 development image"
run = "bash scripts/linux-container.sh --build-image"

[tasks."linux:fetch"]
description = "Download locked dependencies inside the container, the seed's too"
run = ["bash scripts/linux-container.sh mise run fetch", "bash scripts/linux-container.sh mise run fetch:seed"]

[tasks."linux:verify"]
description = "Full verification inside the container"
run = "bash scripts/linux-container.sh mise run verify"

[tasks."linux:quick"]
description = "Fast iteration check inside the container"
run = "bash scripts/linux-container.sh mise run verify:quick"

[tasks."linux:build"]
description = "Build the self-hosted compiler inside the container"
run = "bash scripts/linux-container.sh mise run build"

[tasks."linux:shell"]
description = "Interactive shell inside the container"
run = "bash scripts/linux-container.sh bash"
raw = true
