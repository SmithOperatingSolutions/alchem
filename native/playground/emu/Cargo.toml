[package]
name = "alchem-emu"
version = "0.1.0"
edition = "2021"
description = "An x86-64 interpreter for the Linux programs the native Alchem compiler makes, for a playground in the browser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "emu-run"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
